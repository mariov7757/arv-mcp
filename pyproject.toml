[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arv-mcp"
# The version lives only in src/arv_mcp/__init__.py (see [tool.hatch.version]).
dynamic = ["version"]
description = "MCP server that estimates after-repair value (ARV) from scored, gated sold comps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mario Verdugo" }]
keywords = ["mcp", "real-estate", "arv", "comps", "appraisal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "anyio>=4",
    # data/client.py subclasses HomeHarvest internals; pinned to the tested range.
    "homeharvest>=0.8.18,<0.9",
    "mcp>=2.3,<3",
    "pydantic>=2.0",
    "requests>=2.31",
    "tenacity>=8",
]

[project.scripts]
arv-mcp = "arv_mcp.server:main"

[project.optional-dependencies]
dev = [
    "jsonschema>=4",
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/mariov7757/arv-mcp"
Issues = "https://github.com/mariov7757/arv-mcp/issues"

[tool.hatch.version]
path = "src/arv_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/arv_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits HomeHarvest over the network (deselected by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Ported code keeps its aligned-column constant tables and long breakdown rows.
ignore = ["E221", "E241", "E501"]

[tool.ruff.lint.per-file-ignores]
# Fixtures shared by importing them look like redefinitions to ruff.
"tests/*" = ["F811"]
